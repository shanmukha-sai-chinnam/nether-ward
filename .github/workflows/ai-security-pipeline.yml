name: Nether Ward AI Security CI/CD (Rust)

on:
  push:
    branches:
      - trunk
      - main
  pull_request:
    branches:
      - trunk
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Rust Code & Declarative Configs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Validate JSON Schemas
        run: |
          echo "==> Validating values.json declarative configuration..."
          jq empty values.json

      - name: Format Check (cargo fmt)
        run: |
          echo "==> Checking Rust formatting..."
          cargo fmt --all -- --check

      - name: Linter Check (cargo clippy)
        run: |
          echo "==> Running Clippy linter..."
          cargo clippy --all-targets -- -D warnings

  secret-scan:
    name: Static Secret & Credential Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scan Tracked Files for Leaked Credentials
        run: |
          echo "==> Scanning tracked files for exposed API keys and sensitive tokens..."
          EXPOSED_KEYS=$(git grep -En '(AIzaSy[A-Za-z0-9_-]{33}|AQ\.[A-Za-z0-9_-]{40,}|sk-[A-Za-z0-9]{20,})' \
            -- ':!config/redteam_config.yaml' ':!*.md' || true)
          if [ -n "$EXPOSED_KEYS" ]; then
            echo "::error::Potential unmasked credential detected in git repository:"
            echo "$EXPOSED_KEYS"
            exit 1
          fi
          echo "No exposed credentials detected. Static security check passed."

  threat-triage-unit:
    name: Threat Triage Engine Unit Tests (Rust)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo Test Suite
        run: |
          echo "==> Testing autonomous threat triage engine and heuristics in Rust..."
          cargo test --verbose

      - name: Run Batch Threat Triage Engine on Synthetic Dataset
        run: |
          echo "==> Testing batch directory threat triage infrastructure on sample dataset..."
          cargo run -- threat --dir datasets/threat_samples || true

  dependency-audit:
    name: RustSec Dependency Vulnerability Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: RustSec Security Advisory Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review & Supply Chain Guard
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  ai-redteam-eval:
    name: Synthetic Red Team (OWASP Top 10 for LLMs)
    runs-on: ubuntu-24.04
    needs: [validate, secret-scan, threat-triage-unit, dependency-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Nether Ward Release Binary
        run: cargo build --release

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0.24.3
        with:
          format: spdx-json
          output-file: reports/nether-ward.spdx.json

      - name: Run Synthetic Red Team Evaluation
        id: redteam
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured in GitHub repository."
            echo "Add GEMINI_API_KEY to Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "==> Starting Native Rust OWASP Top 10 for LLMs Synthetic Red Team Evaluation..."
          ./target/release/nether-ward redteam --config config/redteam_config.yaml --dataset datasets/owasp_top10_expanded.jsonl --concurrency 8 || true

      - name: Publish Test Results to GitHub Checks
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          check_name: "AI Red Team Security Matrix"
          report_paths: "reports/redteam.junit.xml"
          require_tests: false
          fail_on_failure: false
          check_annotations: false
          annotate_only: false
          detailed_summary: true

      - name: Upload Security Reports & HTML Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-redteam-reports
          if-no-files-found: ignore
          path: |
            reports/redteam_report.html
            reports/redteam_report.json
            reports/redteam.junit.xml
            reports/nether-ward.spdx.json
          retention-days: 30

      - name: Prepare GitHub Pages Static Site
        if: always()
        run: |
          mkdir -p public
          if [ -f reports/redteam_report.html ]; then
            cp reports/redteam_report.html public/index.html
          fi
          if [ -f reports/redteam.junit.xml ]; then
            cp reports/redteam.junit.xml public/redteam.junit.xml
          fi
          if [ -f reports/redteam_report.json ]; then
            cp reports/redteam_report.json public/redteam_report.json
          fi
          if [ -f reports/nether-ward.spdx.json ]; then
            cp reports/nether-ward.spdx.json public/nether-ward.spdx.json
          fi
          cp values.json public/values.json || true
          echo "Prepared GitHub Pages static payload:"
          ls -lh public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        if: always()
        with:
          path: public/

  deploy-pages:
    name: Deploy Security Reports to GitHub Pages
    runs-on: ubuntu-24.04
    needs: ai-redteam-eval
    if: (github.ref == 'refs/heads/trunk' || github.ref == 'refs/heads/main') && !cancelled()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
