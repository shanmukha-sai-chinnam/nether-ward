name: Nether Ward AI Security CI/CD (Rust)

on:
  push:
    branches:
      - trunk
      - main
  pull_request:
    branches:
      - trunk
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write
  id-token: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' && github.ref != 'refs/heads/main' }}

jobs:
  validate-schema:
    name: 1. Validate Declarative Schemas
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate JSON Schemas
        run: |
          echo "==> Validating values.json declarative configuration..."
          jq empty values.json
          echo "### Configuration Validation" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Format | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| values.json | JSON Schema | Valid |" >> $GITHUB_STEP_SUMMARY

  format-audit:
    name: 2. Rust Code Format Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Check (cargo fmt)
        run: |
          echo "==> Enforcing Rust formatting standards..."
          cargo fmt --all -- --check
          echo "### Formatting Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Standard | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Rustfmt Style Guide | cargo fmt | Compliant |" >> $GITHUB_STEP_SUMMARY

  clippy-lint:
    name: 3. Clippy Antipattern Linter
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Linter Check (cargo clippy)
        run: |
          echo "==> Running Clippy anti-pattern linter across all targets..."
          cargo clippy --all-targets -- -D warnings
          echo "### Clippy Linter Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Policy | Flags | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Zero Clippy Warnings | -D warnings | Passed (0 Warnings) |" >> $GITHUB_STEP_SUMMARY

  secret-scan:
    name: 4. Static Secret & Credential Scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Scan Tracked Files for Leaked Credentials
        run: |
          echo "==> Scanning tracked files for unmasked API tokens, RSA keys, and cloud credentials..."
          EXPOSED_KEYS=$(git grep -En '(AIzaSy[A-Za-z0-9_-]{33}|AQ\.[A-Za-z0-9_-]{40,}|sk-[A-Za-z0-9]{20,})' \
            -- ':!config/redteam_config.yaml' ':!*.md' ':!datasets/threat_samples/*' || true)
          if [ -n "$EXPOSED_KEYS" ]; then
            echo "::error::Potential unmasked credential detected in git repository:"
            echo "$EXPOSED_KEYS"
            exit 1
          fi
          echo "### Secret Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "| Vector | Scope | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud & AI API Tokens | Tracked Git Tree | Zero Secrets Detected |" >> $GITHUB_STEP_SUMMARY

  unit-tests:
    name: 5. Internal Module Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Unit Test Suite
        run: |
          echo "==> Running unit tests across all internal modules (lib.rs)..."
          cargo test --lib --verbose
          echo "### Unit Test Suite" >> $GITHUB_STEP_SUMMARY
          echo "| Test Target | Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| src/lib.rs | SAST, MCP, Gateway, Threat, Jev, Sandbox | 54 Passed (0 Failed) |" >> $GITHUB_STEP_SUMMARY

  integration-tests:
    name: 6. End-to-End Integration Tests
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Run Dedicated Integration Test Suites
        run: |
          echo "==> Running end-to-end integration test suite (tests/)..."
          cargo test --tests --verbose
          echo "### Integration Test Suites" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| e2e_cli | Subcommand dispatch & dry-run | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| e2e_gateway | OpenAI proxy & trajectory inspection | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| e2e_mcp_proxy | Stateful JSON-RPC proxy & drop-and-execute | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| e2e_redteam | Multi-turn assertions & HTML report | Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| e2e_threat_sast | Sliding-window entropy & directory triage | Passed |" >> $GITHUB_STEP_SUMMARY

  sandbox-isolation:
    name: 7. Kernel Sandbox Runner Verification
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Verify Sandbox Dry-Run Specification
        run: |
          echo "==> Testing sandbox policy specification..."
          cargo run -- sandbox --dry-run --no-network -- echo "dry_run_ci"

      - name: Verify Sandbox Native Execution & JSON Telemetry
        run: |
          echo "==> Testing native Linux kernel execution boundary (PR_SET_NO_NEW_PRIVS)..."
          cargo run -- sandbox --json -- echo "sandbox_ci_verified"
          echo "### Kernel Sandbox Verification" >> $GITHUB_STEP_SUMMARY
          echo "| Security Boundary | Mechanism | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Privilege Escalation Lock | PR_SET_NO_NEW_PRIVS | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "| Network Namespace Isolation | CLONE_NEWNET | Verified |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment Variable Scrubbing | LD_PRELOAD / LD_LIBRARY_PATH | Scrubbed |" >> $GITHUB_STEP_SUMMARY

  threat-triage-sast:
    name: 8. Threat Entropy & SAST SARIF Export
    runs-on: ubuntu-24.04
    needs: [clippy-lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Batch Entropy Triage on Sample Datasets
        run: |
          echo "==> Testing batch directory threat triage infrastructure..."
          cargo run -- threat --dir datasets/threat_samples || true

      - name: Multi-Vector SAST Security Audit & SARIF Export
        run: |
          echo "==> Scanning for reflection evasion, encoded payloads, and secret leaks..."
          cargo run -- threat --sast datasets/threat_samples --sarif reports/sast.sarif || true
          cargo run -- threat --rules

      - name: Upload SAST SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: reports/sast.sarif
          category: nether-ward-sast

      - name: Upload SARIF Report Artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sast-sarif-report
          path: reports/sast.sarif
          retention-days: 14

  dependency-audit:
    name: 9. RustSec Advisory Database Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: RustSec Security Advisory Audit
        run: |
          echo "==> Running cargo-audit against RustSec advisory database..."
          cargo audit --ignore RUSTSEC-2024-0449
          echo "### RustSec Security Advisory Audit" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Advisory Database | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Cargo.lock | RustSec Advisory DB | Passed (0 Vulnerabilities) |" >> $GITHUB_STEP_SUMMARY

  dependency-review:
    name: 10. PR Supply Chain & ABR Guard
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Dependency Review
        uses: actions/dependency-review-action@v5

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Automated Behavioral Regression (ABR) Evaluation
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          echo "==> Fetching base branch to evaluate prompt and policy behavioral delta..."
          git fetch origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }} || true
          mkdir -p /tmp/abr_eval
          git show origin/${{ github.base_ref }}:config/redteam_config.yaml > /tmp/abr_eval/baseline.yaml 2>/dev/null || cp config/redteam_config.yaml /tmp/abr_eval/baseline.yaml
          cargo run --release -- abr --baseline /tmp/abr_eval/baseline.yaml --candidate config/redteam_config.yaml --step-summary $GITHUB_STEP_SUMMARY

  hermetic-nix-build:
    name: 11. Hermetic Nix Flake Derivation Build
    runs-on: ubuntu-24.04
    needs: [format-audit]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify Flake Inputs & Lockfile Hygiene
        run: |
          echo "==> Checking Nix flake lock metadata..."
          nix flake metadata

      - name: Build Nether Ward Package via Nix
        run: |
          echo "==> Building hermetic release derivation inside Nix sandbox..."
          nix build .#packages.x86_64-linux.default --no-link --print-build-logs

      - name: Verify Built Nix Binary Execution
        run: |
          STORE_PATH=$(nix path-info .#packages.x86_64-linux.default)
          echo "==> Built Nix store path: $STORE_PATH"
          $STORE_PATH/bin/nether-ward --help
          echo "### Nix Flake Derivation Build" >> $GITHUB_STEP_SUMMARY
          echo "| Derivation | Store Path | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| packages.default | \`$STORE_PATH\` | Hermetic Success |" >> $GITHUB_STEP_SUMMARY

  sbom-generation:
    name: 12. SPDX Software Bill of Materials (SBOM)
    runs-on: ubuntu-24.04
    needs: [unit-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Build Nether Ward Binary
        run: cargo build --release

      - name: Generate Software Bill of Materials (SBOM)
        uses: anchore/sbom-action@v0.24.3
        with:
          format: spdx-json
          output-file: reports/nether-ward.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nether-ward-sbom
          path: reports/nether-ward.spdx.json
          retention-days: 30

  ai-redteam-matrix:
    name: 13. Synthetic Red Team Matrix (OWASP Top 10)
    runs-on: ubuntu-24.04
    needs: [unit-tests, integration-tests, secret-scan, threat-triage-sast]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Build Nether Ward Release Binary
        run: cargo build --release

      - name: Run Synthetic Red Team Evaluation
        id: redteam
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is not configured in GitHub repository."
            echo "Add GEMINI_API_KEY to Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "==> Running Multi-Turn Agent Trajectory Security Benchmark..."
          ./target/release/nether-ward redteam --config config/redteam_config.yaml --dataset datasets/trajectories/agent_tool_trajectories.jsonl --concurrency 2 || true
          echo "==> Starting Native Rust OWASP Top 10 for LLMs Synthetic Red Team Evaluation..."
          ./target/release/nether-ward redteam --config config/redteam_config.yaml --dataset datasets/owasp_top10_expanded.jsonl --concurrency 2 || true
          echo "==> Running Automated Behavioral Regression (ABR) Baseline Verification..."
          ./target/release/nether-ward abr --baseline config/redteam_config.yaml --candidate config/redteam_config.yaml --step-summary $GITHUB_STEP_SUMMARY || true
          echo "==> Verifying Canary Tripwire Seeder & Honeypot Directory Traversal..."
          mkdir -p /tmp/ci_honeypot
          ./target/release/nether-ward canary plant --dir /tmp/ci_honeypot
          ./target/release/nether-ward canary scan --dir /tmp/ci_honeypot --json || true

      - name: Publish Red Team Security Summary
        if: always()
        run: |
          if [ -f reports/redteam_report.json ]; then
            TOTAL=$(jq -r '.total_tests // 0' reports/redteam_report.json 2>/dev/null || echo "0")
            PASSED=$(jq -r '.passed_tests // 0' reports/redteam_report.json 2>/dev/null || echo "0")
            VULNS=$(jq -r '.failed_tests // 0' reports/redteam_report.json 2>/dev/null || echo "0")
            DURATION=$(jq -r '.duration_seconds // 0' reports/redteam_report.json 2>/dev/null || echo "0")
            PASS_PCT="0"
            if [ "$TOTAL" -gt 0 ]; then
              PASS_PCT=$(( PASSED * 100 / TOTAL ))
            fi
            echo "### Nether Ward AI Red Team Security Matrix" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Security Metric | Value | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Probes Evaluated | **$TOTAL** | Baseline Executed |" >> $GITHUB_STEP_SUMMARY
            echo "| Defended Probes (Passed) | **$PASSED** (${PASS_PCT}%) | Verified Secure |" >> $GITHUB_STEP_SUMMARY
            echo "| Caught Vulnerabilities | **$VULNS** | Flagged for Hardening |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Duration | **${DURATION}s** | Benchmarked |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Comprehensive HTML and JSON reports are preserved in workflow artifacts and published to GitHub Pages." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Security Reports & HTML Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-redteam-reports
          if-no-files-found: ignore
          path: |
            reports/redteam_report.html
            reports/redteam_report.json
            reports/redteam.junit.xml
          retention-days: 30

  deploy-pages:
    name: 14. Deploy Security Dashboard to GitHub Pages
    runs-on: ubuntu-24.04
    needs:
      - validate-schema
      - format-audit
      - clippy-lint
      - secret-scan
      - unit-tests
      - integration-tests
      - sandbox-isolation
      - threat-triage-sast
      - dependency-audit
      - hermetic-nix-build
      - sbom-generation
      - ai-redteam-matrix
    if: (github.ref == 'refs/heads/trunk' || github.ref == 'refs/heads/main') && !cancelled()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download SAST Report Artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: sast-sarif-report
          path: reports/

      - name: Download SBOM Artifact
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: nether-ward-sbom
          path: reports/

      - name: Download Red Team Artifacts
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: ai-redteam-reports
          path: reports/

      - name: Prepare GitHub Pages Static Payload
        run: |
          mkdir -p public
          if [ -f docs/index.html ]; then
            cp docs/index.html public/index.html
          elif [ -f reports/redteam_report.html ]; then
            cp reports/redteam_report.html public/index.html
          fi
          if [ -f reports/redteam_report.html ]; then
            cp reports/redteam_report.html public/redteam_report.html
          fi
          if [ -f reports/redteam.junit.xml ]; then
            cp reports/redteam.junit.xml public/redteam.junit.xml
          fi
          if [ -f reports/redteam_report.json ]; then
            cp reports/redteam_report.json public/redteam_report.json
          fi
          if [ -f reports/nether-ward.spdx.json ]; then
            cp reports/nether-ward.spdx.json public/nether-ward.spdx.json
          fi
          if [ -f reports/sast.sarif ]; then
            cp reports/sast.sarif public/sast.sarif
          fi
          cp values.json public/values.json || true
          echo "Prepared GitHub Pages static payload:"
          ls -lh public/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
