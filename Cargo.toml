[package]
name = "nether-ward"
version = "0.2.0"
edition = "2021"
description = "Static security scanner and adversarial red team evaluation harness in Rust and Nix"
authors = ["shanmukha-sai-chinnam"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1.10"
axum = "0.7"
colored = "2.1"
chrono = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

[[bin]]
name = "nether-ward"
path = "src/main.rs"
